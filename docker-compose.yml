
# Docker Compose - Intelligent IoT Solutions MVP

services:

  # MySQL database
  db:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_ROOT_PASSWORD}
      MYSQL_DATABASE: iot_monitoring
      MYSQL_USER: iot_app
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Flask REST API
  api:
    build: .
    restart: unless-stopped

    ports:
      - "5006:5000"

    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: iot_monitoring
      MYSQL_USER: iot_app
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
